<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Royal Paparazzi</title>
    <meta name="description" content="Royal Paparazzi photography and event services.">

    <link rel="stylesheet" href="./src/styles/output.css">
</head>

<body class="bg-background">

    <section class="grid grid-cols-6 gap-1 m-3">
        <a href="./src/pages/gallery.html#weddings">
            <article
                class="border shadow-sm shadow-muted border-border rounded-md overflow-hidden bg-background text-text">
                <div class="flex flex-col text-center items-center p-3">
                    <img src="./public/images/svg's/wedding-rings.svg" alt="" width="50px">
                    <h3 class="font-bold uppercase">weddings</h3>
                    <p class="text-muted text-sm leading-relaxed capitalize">Elegant. timeless. <span
                            class="block">unforgettable</span></p>

                </div>
                <div class="overflow-hidden aspect-4/3">
                    <img src="./public/images/wedding-image.jpeg" alt="" class="w-full h-full object-cover">
                </div>
            </article>
        </a>

        <a href="./src/pages/gallery.html#birthdays">
            <article
                class="border shadow-sm shadow-muted border-border rounded-md overflow-hidden bg-background text-text">
                <div class="flex flex-col text-center items-center p-3">
                    <img src="./public/images/svg's/birthday-cake.svg" alt="" width="50px">
                    <h3 class="font-bold uppercase">birthday</h3>
                    <p class="text-muted text-sm leading-relaxed capitalize">celebrate every <span class="block">special
                            moment</span></p>

                </div>
                <div class="overflow-hidden aspect-4/3">
                    <img src="./public/images/birthday-image.jpeg" alt="" class="w-full h-full object-cover">
                </div>
            </article>
        </a>

        <a href="./src/pages/gallery.html#events">
            <article
                class="border shadow-sm shadow-muted border-border rounded-md overflow-hidden bg-background text-text">
                <div class="flex flex-col text-center items-center p-3">
                    <img src="./public/images/svg's/photoshoot-camera.svg" alt="" width="50px">
                    <h3 class="font-bold uppercase">Photoshoot</h3>
                    <p class="text-muted text-sm leading-relaxed capitalize">Portraits that. <span class="block">speak
                            volumes.</span></p>

                </div>
                <div class="overflow-hidden aspect-4/3">
                    <img src="./public/images/photoshoot.jpg" alt="" class="w-full h-full object-cover">
                </div>
            </article>
        </a>

        <a href="./src/pages/gallery.html#events">
            <article
                class="border shadow-sm shadow-muted border-border rounded-md overflow-hidden bg-background text-text">
                <div class="flex flex-col text-center items-center p-3">
                    <img src="./public/images/svg's/events-people.svg" alt="" width="50px">
                    <h3 class="font-bold uppercase">events</h3>
                    <p class="text-muted text-sm leading-relaxed capitalize">from small gatherings <span
                            class="block">to
                            grand events.</span></p>

                </div>
                <div class="overflow-hidden aspect-4/3">
                    <img src="./public/images/events.jpeg" alt="" class="w-full h-full object-cover">
                </div>
            </article>
        </a>

        <a href="./src/pages/gallery.html#nature">
            <article
                class="border shadow-sm shadow-muted border-border rounded-md overflow-hidden bg-background text-text">
                <div class="flex flex-col text-center items-center p-3">
                    <img src="./public/images/svg's/outdoor-mountains.svg" alt="" width="50px">
                    <h3 class="font-bold uppercase">outdoor</h3>
                    <p class="text-muted text-sm leading-relaxed capitalize">Nature, adventure and<span
                            class="block">beautiful landscapes.</span></p>

                </div>
                <div class="overflow-hidden aspect-[4/3]">
                    <img src="./public/images/nature.png" alt="" class="w-full h-full object-cover">
                </div>
            </article>
        </a>

        <a href="./src/pages/gallery.html#socail-events">
            <article
                class="border shadow-sm shadow-muted border-border rounded-md overflow-hidden bg-background text-text">
                <div class="flex flex-col text-center items-center p-3">
                    <img src="./public/images/svg's/social-events-balloons.svg" alt="" width="50px">
                    <h3 class="font-bold uppercase">social events</h3>
                    <p class="text-muted text-sm leading-relaxed capitalize">parties, hangouts and<span
                            class="block">social
                            celebrations.</span></p>

                </div>
                <div class="overflow-hidden aspect-4/3">
                    <img src="./public/images/social-events.jpeg" alt="" class="w-full h-full object-cover">
                </div>
            </article>
        </a>

    </section>
    <script src="./src/js/main.js"></script>
