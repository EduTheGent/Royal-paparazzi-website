<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Royal Paparazzi</title>
    <meta name="description" content="Royal Paparazzi photography and event services.">

    <link rel="stylesheet" href="./src/styles/output.css">
</head>


<body class="bg-background text-text my-40">

    <section class="relative flex items-center justify-center bg-background h-[50vh]  my-20 text-3xl px-8">
        <div class="lg:grid grid-cols-9 p-10 scale-100 ">

            <div class="absolute inset-0 bg-linear-to-r from-background via-surface/40 to-background/90"></div>

            <div class="relative p-3 w-full text-3xl col-span-4">
                <p class="text-primary mb-3 text-lg font-semibold uppercase tracking-[0.5em]">Capturing moments.</p>
                <h1 class=" text-text font-extrabold uppercase leading-none mb-3 l text-5xl whitespace-nowrap">Creating
                    Memories <span class="block text-primary ">that last forever</span></h1>

                <P class="pt-2 text-muted max-w-[30.9vw] border-t border-muted "><span class="text-primary">Royal
                        Paparazzi</span> Photography
                    captures
                    life's most
                    beautiful moments with
                    creativity, passion
                    and a touch of royalty</P>

                <div class="mt-5 flex gap-4 grow uppercase">
                    <button
                        class="flex items-center gap-4 rounded-md bg-primary text-text px-6 py-3 text-xs font-semibold uppercase tracking-wide transition ">
                        book now

                        <span>↗</span>
                    </button>

                    <button
                        class="flex items-center gap-1.5 rounded-md border border-text text-text px-6 py-3 text-xs font-semibold uppercase tracking-wide transition hover:border-white hover:cursor-progress">
                        View Gallery

                        <span>▦</span>
                    </button>
                </div>
            </div>

            <div class="col-span-5 max-w-[88%]">
                <img src="./public/images/heroCamera.png" alt="A Camera"
                    class="relative lg:scale-150 translate-y-5 -translate-1 object-cover w-fit">
            </div>

        </div>

        <div class="absolute top-1/6 right-5 flex flex-col justify-center items-center z-10 gap-5 text-sm font-bold">
            <div class="w-px h-8 bg-muted"></div>
            <a href="#">
                ◎
            </a>
            <a href="#">
                f
            </a>
            <a href="#">
                🖇️
            </a>
            <div class="w-px h-8 bg-muted"></div>
        </div>
    </section>


    <script src="./src/js/main.js"></script>
</body>

</html>
